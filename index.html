<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Santony Burger - Menú Online</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;600;700&display=swap');
        
        .font-brand { font-family: 'Anton', sans-serif; letter-spacing: 1px; }
        .font-body { font-family: 'Poppins', sans-serif; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #18181b; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #e11d48; }

        .active-tab {
            background-color: #e11d48 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-body min-h-screen pb-24">

    <!-- Navbar / Header -->
    <header class="sticky top-0 z-30 bg-zinc-900/90 backdrop-blur-md border-b border-zinc-800 px-4 py-3 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-rose-600 flex items-center justify-center font-brand text-2xl text-white shadow-red-900/30 shadow-lg">
                    S
                </div>
                <div>
                    <h1 class="font-brand text-2xl tracking-wide text-rose-500 uppercase leading-none">Santony Burger</h1>
                    <p class="text-xs text-zinc-400">Pedí online directo a nuestro WhatsApp</p>
                </div>
            </div>
            
            <button onclick="toggleConfigModal()" class="text-zinc-400 hover:text-rose-500 transition-colors p-2 rounded-lg hover:bg-zinc-800" title="Configurar Menú / Teléfono">
                <i class="fa-solid fa-gear text-xl"></i>
            </button>
        </div>
    </header>

    <!-- Banner Promocional -->
    <div class="max-w-4xl mx-auto p-4">
        <div class="bg-gradient-to-r from-rose-900/40 to-amber-900/40 border border-rose-500/30 rounded-2xl p-4 flex items-center justify-between shadow-xl">
            <div>
                <span class="bg-rose-600 text-white text-[10px] uppercase font-bold px-2 py-0.5 rounded-full">Envío Gratis</span>
                <h2 class="text-lg font-bold text-white mt-1">Sabor 100% Artesanal</h2>
                <p class="text-xs text-zinc-300">Medallones smashed y el auténtico cheddar fundido.</p>
            </div>
            <div class="text-3xl text-rose-500 pr-2">
                🍔
            </div>
        </div>
    </div>

    <!-- Navegación de Categorías -->
    <nav class="sticky top-[61px] z-20 bg-zinc-950/95 border-b border-zinc-800/80 backdrop-blur-md py-3 px-4 mb-4">
        <div class="max-w-4xl mx-auto flex space-x-2 overflow-x-auto no-scrollbar" id="categories-nav">
            <!-- Categorías generadas por JS -->
        </div>
    </nav>

    <!-- Listado de Productos -->
    <main class="max-w-4xl mx-auto px-4">
        <div id="products-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Productos renderizados dinámicamente -->
        </div>
    </main>

    <!-- Barra de Carrito Flotante (Bottom) -->
    <div id="cart-bar" class="fixed bottom-0 left-0 right-0 z-40 p-4 bg-gradient-to-t from-zinc-950 via-zinc-950/90 to-transparent transition-transform transform translate-y-full">
        <div class="max-w-4xl mx-auto">
            <button onclick="toggleCartDrawer()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-3.5 px-6 rounded-2xl shadow-xl shadow-rose-900/40 flex items-center justify-between transition-all active:scale-[0.99]">
                <div class="flex items-center space-x-3">
                    <span id="cart-count-badge" class="bg-white text-rose-600 font-extrabold text-xs w-6 h-6 rounded-full flex items-center justify-center">0</span>
                    <span>Ver mi pedido</span>
                </div>
                <span id="cart-total-bar" class="text-lg font-bold">$0</span>
            </button>
        </div>
    </div>

    <!-- Drawer Carrito de Compras -->
    <div id="cart-drawer" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden transition-opacity">
        <div class="fixed inset-y-0 right-0 max-w-md w-full bg-zinc-900 shadow-2xl flex flex-col border-l border-zinc-800">
            <!-- Header Carrito -->
            <div class="p-4 border-b border-zinc-800 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bag-shopping text-rose-500 text-xl"></i>
                    <h3 class="font-brand text-xl tracking-wide">Tu Pedido</h3>
                </div>
                <button onclick="toggleCartDrawer()" class="text-zinc-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Items en el carrito -->
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Items generados dinámicamente -->
            </div>

            <!-- Formulario Datos del Cliente -->
            <div class="p-4 border-t border-zinc-800 bg-zinc-950/50 space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Nombre Completo *</label>
                    <input type="text" id="cust-name" placeholder="Ej: Lucas Gómez" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-rose-500">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Tipo de Entrega</label>
                        <select id="cust-delivery" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-rose-500">
                            <option value="Delivery">Delivery</option>
                            <option value="Take Away">Retiro por local</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-zinc-400 mb-1">Medio de Pago</label>
                        <select id="cust-payment" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-rose-500">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia">Transferencia</option>
                            <option value="Mercado Pago">Mercado Pago</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Dirección de Entrega / Notas</label>
                    <input type="text" id="cust-address" placeholder="Calle, Número, Piso/Depto" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-rose-500">
                </div>

                <!-- Resumen de Costos -->
                <div class="pt-2 border-t border-zinc-800 flex justify-between items-center text-lg font-bold">
                    <span>Total a Pagar:</span>
                    <span id="cart-final-total" class="text-rose-500">$0</span>
                </div>

                <button onclick="sendOrderToWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-green-900/30 flex items-center justify-center space-x-2 transition-all active:scale-[0.99]">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Enviar Pedido por WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Personalización de Producto -->
    <div id="product-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div class="relative h-48 bg-zinc-800">
                <img id="modal-img" src="" class="w-full h-full object-cover" alt="">
                <button onclick="closeProductModal()" class="absolute top-3 right-3 bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center backdrop-blur-md">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="p-4 overflow-y-auto flex-1 space-y-4">
                <div>
                    <h3 id="modal-title" class="text-xl font-bold text-white"></h3>
                    <p id="modal-desc" class="text-xs text-zinc-400 mt-1"></p>
                </div>

                <!-- Selector de Tamaño / Versión -->
                <div id="variant-section" class="space-y-2 hidden">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-rose-500">Seleccioná el Tamaño</label>
                    <div id="variant-options" class="grid grid-cols-3 gap-2"></div>
                </div>

                <!-- Opciones de Extras -->
                <div id="extras-section" class="space-y-2 hidden">
                    <label class="block text-xs font-semibold uppercase tracking-wider text-rose-500">Agregados Opcionales</label>
                    <div id="extras-options" class="space-y-1.5"></div>
                </div>

                <!-- Notas Especiales -->
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 mb-1">Aclaración para la cocina</label>
                    <input type="text" id="modal-notes" placeholder="Ej: Sin cebolla, aderezo aparte..." class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-xs text-zinc-100 focus:outline-none focus:border-rose-500">
                </div>
            </div>

            <div class="p-4 border-t border-zinc-800 bg-zinc-950 flex items-center justify-between">
                <div class="flex items-center space-x-3 bg-zinc-800 rounded-xl p-1 border border-zinc-700">
                    <button onclick="updateModalQty(-1)" class="w-8 h-8 text-zinc-300 hover:text-white flex items-center justify-center font-bold text-lg">-</button>
                    <span id="modal-qty" class="text-sm font-bold w-4 text-center">1</span>
                    <button onclick="updateModalQty(1)" class="w-8 h-8 text-zinc-300 hover:text-white flex items-center justify-center font-bold text-lg">+</button>
                </div>

                <button onclick="confirmAddToCart()" class="bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 px-5 rounded-xl flex items-center space-x-2 text-sm shadow-lg shadow-rose-900/30">
                    <span>Agregar</span>
                    <span id="modal-total-btn">$0</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Configuración Negocio / CSV -->
    <div id="config-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <h3 class="font-bold text-lg text-white">⚙️ Configuración del Negocio</h3>
                <button onclick="toggleConfigModal()" class="text-zinc-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1">Número de WhatsApp (Con código de país)</label>
                <input type="text" id="config-phone" placeholder="Ej: 5491123456789" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-sm text-zinc-100 focus:outline-none focus:border-rose-500">
            </div>

            <div>
                <label class="block text-xs font-semibold text-zinc-400 mb-1">URL de Google Sheets (Publicado como CSV)</label>
                <input type="text" id="config-csv-url" placeholder="https://docs.google.com/.../pub?output=csv" class="w-full bg-zinc-800 border border-zinc-700 rounded-xl p-2.5 text-xs text-zinc-100 focus:outline-none focus:border-rose-500">
                <p class="text-[10px] text-zinc-500 mt-1">Archivo > Compartir > Publicar en la Web > CSV.</p>
            </div>

            <div class="pt-2 flex justify-end space-x-2">
                <button onclick="resetToDefaultData()" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-xs rounded-xl text-zinc-300">Restablecer Prueba</button>
                <button onclick="saveConfigAndSync()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-xs font-bold rounded-xl text-white">Guardar y Sincronizar</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Principal -->
    <script>
        // Datos de muestra predeterminados
        const DEFAULT_PRODUCTS = [
            {
                id: 'burger-01',
                nombre: 'Santony Classic',
                categoria: 'hamburguesas',
                descripcion: 'Medallón artesanal, quíntuple cheddar fundido, bacon crocante y salsa especial.',
                precio_base: 6500,
                disponible: true,
                imagen: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80',
                variantes: 'Simple:0, Doble:1000, Triple:2000',
                extras: 'Medallón Extra:1500, Bacon Extra:800, Salsa Extra:400'
            },
            {
                id: 'burger-02',
                nombre: 'Oklahoma Smash',
                categoria: 'hamburguesas',
                descripcion: 'Doble medallón smash con cebolla finamente picada e intermitente con abundante cheddar.',
                precio_base: 6200,
                disponible: true,
                imagen: 'https://images.unsplash.com/photo-1586190848861-99aa4a171e90?auto=format&fit=crop&w=600&q=80',
                variantes: 'Simple:0, Doble:1000, Triple:2000',
                extras: 'Medallón Extra:1500, Cheddar Extra:600'
            },
            {
                id: 'papas-01',
                nombre: 'Papas Cheddar & Bacon',
                categoria: 'papas',
                descripcion: 'Porción abundante con queso cheddar cremoso y panceta crocante picada.',
                precio_base: 3200,
                disponible: true,
                imagen: 'https://images.unsplash.com/photo-1576107232684-1279f390859f?auto=format&fit=crop&w=600&q=80',
                variantes: '',
                extras: 'Cheddar Extra:600, Bacon Extra:800'
            },
            {
                id: 'papas-02',
                nombre: 'Papas Santony',
                categoria: 'papas',
                descripcion: 'Papas rústicas con dip de salsa especial de la casa.',
                precio_base: 2800,
                disponible: true,
                imagen: 'https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=600&q=80',
                variantes: '',
                extras: ''
            },
            {
                id: 'bebida-01',
                nombre: 'Coca-Cola 500ml',
                categoria: 'bebidas',
                descripcion: 'Botella de 500ml bien fría.',
                precio_base: 1800,
                disponible: true,
                imagen: 'https://images.unsplash.com/photo-1622483767028-3f66f32aef97?auto=format&fit=crop&w=600&q=80',
                variantes: '',
                extras: ''
            },
            {
                id: 'promo-01',
                nombre: 'Combo Classic',
                categoria: 'combos',
                descripcion: 'Santony Classic Doble + Papas Pequeñas + Coca-Cola 500ml.',
                precio_base: 8900,
                disponible: true,
                imagen: 'https://images.unsplash.com/photo-1610614819513-58e34989848b?auto=format&fit=crop&w=600&q=80',
                variantes: '',
                extras: ''
            }
        ];

        // Estado Global
        let products = [...DEFAULT_PRODUCTS];
        let cart = [];
        let currentCategory = 'todos';
        let selectedProduct = null;
        let selectedVariant = null;
        let selectedExtras = [];
        let modalQty = 1;

        // Configuración por defecto
        let whatsappPhone = '5491123456789';
        let csvUrl = '';

        // Inicialización
        window.onload = () => {
            loadConfig();
            renderCategories();
            renderProducts();
            updateCartUI();
        };

        function loadConfig() {
            const savedPhone = localStorage.getItem('santony_phone');
            const savedCsv = localStorage.getItem('santony_csv');
            if (savedPhone) whatsappPhone = savedPhone;
            if (savedCsv) {
                csvUrl = savedCsv;
                fetchCSVData(csvUrl);
            }
            document.getElementById('config-phone').value = whatsappPhone;
            document.getElementById('config-csv-url').value = csvUrl;
        }

        // Parseador CSV de Google Sheets
        async function fetchCSVData(url) {
            try {
                const response = await fetch(url);
                const text = await response.text();
                const rows = text.split('\n').map(row => row.split(','));
                
                // Asumimos encabezados en la primera fila
                const headers = rows[0].map(h => h.trim().toLowerCase());
                const parsedProducts = [];

                for (let i = 1; i < rows.length; i++) {
                    if (!rows[i] || rows[i].length < 2) continue;
                    const row = rows[i];
                    
                    const p = {
                        id: row[headers.indexOf('id')]?.trim() || `prod-${i}`,
                        nombre: row[headers.indexOf('nombre')]?.trim() || 'Sin Nombre',
                        categoria: row[headers.indexOf('categoria')]?.trim().toLowerCase() || 'general',
                        descripcion: row[headers.indexOf('descripcion')]?.trim() || '',
                        precio_base: parseFloat(row[headers.indexOf('precio_base')] || row[headers.indexOf('precio')]) || 0,
                        disponible: row[headers.indexOf('disponible')]?.trim().toUpperCase() !== 'FALSE',
                        imagen: row[headers.indexOf('imagen')]?.trim() || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80',
                        variantes: row[headers.indexOf('variantes')]?.trim() || '',
                        extras: row[headers.indexOf('extras')]?.trim() || ''
                    };
                    parsedProducts.push(p);
                }

                if (parsedProducts.length > 0) {
                    products = parsedProducts;
                    renderCategories();
                    renderProducts();
                }
            } catch (err) {
                console.error("Error al cargar CSV:", err);
                alert("No se pudo cargar la planilla. Verifica que el enlace sea un CSV publicado correctamente.");
            }
        }

        // Navegación & Categorías
        function renderCategories() {
            const nav = document.getElementById('categories-nav');
            const categories = ['todos', ...new Set(products.map(p => p.categoria))];
            
            nav.innerHTML = categories.map(cat => `
                <button onclick="setCategory('${cat}')" 
                    class="px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider transition-all whitespace-nowrap border border-zinc-800 ${currentCategory === cat ? 'active-tab' : 'bg-zinc-900 text-zinc-400 hover:text-white'}">
                    ${cat}
                </button>
            `).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderProducts();
        }

        // Renderizado de Productos
        function renderProducts() {
            const container = document.getElementById('products-container');
            const filtered = currentCategory === 'todos' 
                ? products 
                : products.filter(p => p.categoria === currentCategory);

            container.innerHTML = filtered.map(p => `
                <div class="bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden shadow-lg hover:border-zinc-700 transition-all flex flex-col justify-between">
                    <div class="flex p-3 space-x-3">
                        <img src="${p.imagen}" class="w-24 h-24 object-cover rounded-xl bg-zinc-800 flex-shrink-0" alt="${p.nombre}">
                        <div class="flex-1">
                            <h3 class="font-bold text-white text-base">${p.nombre}</h3>
                            <p class="text-xs text-zinc-400 mt-1 line-clamp-2">${p.descripcion}</p>
                            <span class="inline-block mt-2 font-bold text-rose-500 text-sm">$${p.precio_base.toLocaleString()}</span>
                        </div>
                    </div>
                    <div class="p-3 border-t border-zinc-800/60 bg-zinc-950/40">
                        <button onclick="openProductModal('${p.id}')" class="w-full bg-zinc-800 hover:bg-rose-600 hover:text-white text-zinc-200 text-xs font-bold py-2 rounded-xl transition-all flex items-center justify-center space-x-1">
                            <i class="fa-solid fa-plus text-[10px]"></i>
                            <span>Personalizar / Agregar</span>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Modal de Personalización
        function openProductModal(id) {
            selectedProduct = products.find(p => p.id === id);
            if (!selectedProduct) return;

            modalQty = 1;
            selectedExtras = [];
            document.getElementById('modal-notes').value = '';

            document.getElementById('modal-title').innerText = selectedProduct.nombre;
            document.getElementById('modal-desc').innerText = selectedProduct.descripcion;
            document.getElementById('modal-img').src = selectedProduct.imagen;

            // Renderizar Variantes (Simple, Doble, Triple)
            const variantSec = document.getElementById('variant-section');
            const variantOpts = document.getElementById('variant-options');
            
            if (selectedProduct.variantes) {
                const variants = selectedProduct.variantes.split(',').map(v => {
                    const [name, price] = v.split(':');
                    return { name: name.trim(), price: parseFloat(price) || 0 };
                });

                selectedVariant = variants[0]; // Predeterminada
                variantSec.classList.remove('hidden');
                
                variantOpts.innerHTML = variants.map((v, idx) => `
                    <button onclick="selectVariant(${idx})" id="var-btn-${idx}" 
                        class="variant-btn p-2 border border-zinc-700 rounded-xl text-center text-xs transition-all bg-zinc-800 text-zinc-300">
                        <div class="font-bold">${v.name}</div>
                        <div class="text-[10px] text-zinc-400 mt-0.5">${v.price > 0 ? `+$${v.price}` : 'Base'}</div>
                    </button>
                `).join('');
                highlightSelectedVariant(0);
            } else {
                selectedVariant = { name: 'Estándar', price: 0 };
                variantSec.classList.add('hidden');
            }

            // Renderizar Extras
            const extrasSec = document.getElementById('extras-section');
            const extrasOpts = document.getElementById('extras-options');

            if (selectedProduct.extras) {
                const extras = selectedProduct.extras.split(',').map(e => {
                    const [name, price] = e.split(':');
                    return { name: name.trim(), price: parseFloat(price) || 0 };
                });

                extrasSec.classList.remove('hidden');
                extrasOpts.innerHTML = extras.map((e, idx) => `
                    <label class="flex items-center justify-between p-2 rounded-xl bg-zinc-800/60 border border-zinc-700/50 cursor-pointer text-xs">
                        <div class="flex items-center space-x-2">
                            <input type="checkbox" onchange="toggleExtra('${e.name}', ${e.price})" class="rounded bg-zinc-700 border-zinc-600 text-rose-600 focus:ring-0">
                            <span class="text-zinc-200">${e.name}</span>
                        </div>
                        <span class="text-zinc-400 font-semibold">+$${e.price}</span>
                    </label>
                `).join('');
            } else {
                extrasSec.classList.add('hidden');
            }

            updateModalPrice();
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function selectVariant(index) {
            const variants = selectedProduct.variantes.split(',').map(v => {
                const [name, price] = v.split(':');
                return { name: name.trim(), price: parseFloat(price) || 0 };
            });
            selectedVariant = variants[index];
            highlightSelectedVariant(index);
            updateModalPrice();
        }

        function highlightSelectedVariant(index) {
            document.querySelectorAll('.variant-btn').forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('border-rose-500', 'bg-rose-950/40', 'text-rose-400');
                    btn.classList.remove('border-zinc-700', 'bg-zinc-800', 'text-zinc-300');
                } else {
                    btn.classList.remove('border-rose-500', 'bg-rose-950/40', 'text-rose-400');
                    btn.classList.add('border-zinc-700', 'bg-zinc-800', 'text-zinc-300');
                }
            });
        }

        function toggleExtra(name, price) {
            const idx = selectedExtras.findIndex(e => e.name === name);
            if (idx > -1) {
                selectedExtras.splice(idx, 1);
            } else {
                selectedExtras.push({ name, price });
            }
            updateModalPrice();
        }

        function updateModalQty(delta) {
            if (modalQty + delta >= 1) {
                modalQty += delta;
                document.getElementById('modal-qty').innerText = modalQty;
                updateModalPrice();
            }
        }

        function updateModalPrice() {
            const unitPrice = selectedProduct.precio_base + (selectedVariant?.price || 0) + selectedExtras.reduce((acc, e) => acc + e.price, 0);
            const total = unitPrice * modalQty;
            document.getElementById('modal-total-btn').innerText = `$${total.toLocaleString()}`;
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        // Carrito de Compras
        function confirmAddToCart() {
            const notes = document.getElementById('modal-notes').value.trim();
            const unitPrice = selectedProduct.precio_base + (selectedVariant?.price || 0) + selectedExtras.reduce((acc, e) => acc + e.price, 0);

            cart.push({
                product: selectedProduct,
                variant: selectedVariant,
                extras: [...selectedExtras],
                qty: modalQty,
                unitPrice,
                totalPrice: unitPrice * modalQty,
                notes
            });

            closeProductModal();
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((acc, i) => acc + i.qty, 0);
            const total = cart.reduce((acc, i) => acc + i.totalPrice, 0);

            document.getElementById('cart-count-badge').innerText = count;
            document.getElementById('cart-total-bar').innerText = `$${total.toLocaleString()}`;
            document.getElementById('cart-final-total').innerText = `$${total.toLocaleString()}`;

            const cartBar = document.getElementById('cart-bar');
            if (count > 0) {
                cartBar.classList.remove('translate-y-full');
            } else {
                cartBar.classList.add('translate-y-full');
            }

            renderCartItems();
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-zinc-500 text-xs py-8">Tu carrito está vacío.</p>`;
                return;
            }

            container.innerHTML = cart.map((item, idx) => `
                <div class="bg-zinc-800/60 border border-zinc-700/50 rounded-xl p-3 flex justify-between items-start">
                    <div>
                        <h4 class="font-bold text-sm text-white">${item.product.nombre} <span class="text-rose-400 font-normal">(${item.variant.name})</span></h4>
                        ${item.extras.length > 0 ? `<p class="text-[11px] text-zinc-400">+ ${item.extras.map(e => e.name).join(', ')}</p>` : ''}
                        ${item.notes ? `<p class="text-[10px] text-amber-400 italic">"${item.notes}"</p>` : ''}
                        <div class="text-xs font-bold text-zinc-300 mt-1">$${item.unitPrice.toLocaleString()} x ${item.qty}</div>
                    </div>
                    <div class="flex items-center space-x-2">
                        <span class="font-bold text-rose-500 text-sm">$${item.totalPrice.toLocaleString()}</span>
                        <button onclick="removeFromCart(${idx})" class="text-zinc-500 hover:text-rose-500 p-1">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function removeFromCart(idx) {
            cart.splice(idx, 1);
            updateCartUI();
        }

        function toggleCartDrawer() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('hidden');
        }

        // WhatsApp Checkout
        function sendOrderToWhatsApp() {
            const name = document.getElementById('cust-name').value.trim();
            const delivery = document.getElementById('cust-delivery').value;
            const payment = document.getElementById('cust-payment').value;
            const address = document.getElementById('cust-address').value.trim();

            if (!name) {
                alert('Por favor decinos tu nombre.');
                return;
            }

            if (cart.length === 0) {
                alert('El carrito está vacío.');
                return;
            }

            let msg = `🍔 *¡Nuevo Pedido - Santony Burger!*\n\n`;
            msg += `👤 *Cliente:* ${name}\n`;
            msg += `🛵 *Entrega:* ${delivery}\n`;
            if (address) msg += `📍 *Dirección/Notas:* ${address}\n`;
            msg += `💳 *Pago:* ${payment}\n\n`;
            msg += `📋 *Detalle del Pedido:*\n`;

            cart.forEach(i => {
                msg += `- ${i.qty}x ${i.product.nombre} (${i.variant.name.toUpperCase()}) - $${i.totalPrice.toLocaleString()}\n`;
                if (i.extras.length > 0) {
                    msg += `   + ${i.extras.map(e => e.name).join(', ')}\n`;
                }
                if (i.notes) {
                    msg += `   📝 "${i.notes}"\n`;
                }
            });

            const total = cart.reduce((acc, i) => acc + i.totalPrice, 0);
            msg += `\n💰 *Total A Pagar:* $${total.toLocaleString()}`;

            const encoded = encodeURIComponent(msg);
            window.open(`https://wa.me/${whatsappPhone}?text=${encoded}`, '_blank');
        }

        // Config Modal & Sync
        function toggleConfigModal() {
            document.getElementById('config-modal').classList.toggle('hidden');
        }

        function saveConfigAndSync() {
            const phone = document.getElementById('config-phone').value.trim();
            const csv = document.getElementById('config-csv-url').value.trim();

            if (phone) {
                whatsappPhone = phone;
                localStorage.setItem('santony_phone', phone);
            }

            if (csv) {
                csvUrl = csv;
                localStorage.setItem('santony_csv', csv);
                fetchCSVData(csv);
            }

            toggleConfigModal();
        }

        function resetToDefaultData() {
            localStorage.removeItem('santony_csv');
            products = [...DEFAULT_PRODUCTS];
            renderCategories();
            renderProducts();
            toggleConfigModal();
        }
    </script>
</body>
</html>
